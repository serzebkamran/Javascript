<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My zoo</title>
    <style>

        Body {
            font-family: Arial, sans-serif;
            background: aliceblue;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #FF5A43;
        }

        #zoo {
            border: 2px solid #FF5A43;
            width: 300px;
            margin: 16px auto;
            padding: 12px;
            border-radius: 10px;
            background: white;
        }

        .zone {
            border: 1px solid #FF5A43;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;
        }

        button {
            background: #FF5A43;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
  
    </style>
</head>
<body>
  <h1>My Zoo</h1>
  <p>use javascript and the DOM to add animals to each cage!</p>
  
  <div id="zoo">
    <div class="zone">Zone 1: <span id="zone1"></span></div>
    <div class="zone">Zone 2: <span id="zone2"></span></div>
    <div class="zone">Zone 3: <span id="zone3"></span></div>
    <div class="zone">Total Animals: <span id="total"></span></div>
  </div>

  <br>

  <button onclick="openZoo()">Open the Zoo!</button>

  <p id="zooStatus"></p>

  <script>

    function openZoo() {
        /* task 1: add your first animal to zone 1 */
        document.getElementById("zone1").innerHTML = "Lion";

        /* task 2: add your second animal to zone 2 */
        document.getElementById("zone2").innerHTML = "Elephant";

        /* task 3: add your third animal to zone 3 */
        document.getElementById("zone3").innerHTML = "Giraffe";

        /* task 4: show the total number of animals */
        document.getElementById("total").innerHTML = 3;

    }
  </script>
</body>
</html>
