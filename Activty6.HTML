<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Phone card</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <style>

    </style>
</head>
<body class="py-4">
    <div class="container">
     <h1 class="mb-1">My phone contact</h1>
     <p class="text-muted mb-4">Here are my phone contacts.</p>  
     <div class="card shadow-sm mb-3" style="max-width: 400px;">
        div class="card-body">
            <h5 class="card-title">John Doe</h5>
            <ul class="list-group list-group flush">
                <li class="list-group item">
                    <span class="card-label d-block>Name:</span>
                    <strong id="name">John Doe</strong>
                    </li>
                <li class="list-group item">
                    <span class="card-label d-block">School:</span>
                    <strong id="school">Example High School</strong>
                </li>
            </ul>
         
     </div>
     <div class="card-shadow-sm" style="max-width: 400px;">
        <div class="card-body">
            <h6 style="color:#FF5A43">JavaScript object used</h6>
            <pre id="codedisplay"
            class="bg-light p-3 rounded">
        </div>
         
     </div>
     <script>
        var mycontact = {
            name: "John Doe",
            school: "Example High School"
        }
        document.getElementById("name").textContent = mycontact.name;
        document.getElementById("school").textContent = mycontact.school;
     </script>
</body>    
</body>
</html>
