<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My playlist sorter</title>
    <style>
        body { background: lavender;}
        h1, h3 { color: darkviolet;}
        .box { background: white; color: darkviolet;}
    </style>
</head>
<body>
    <div class="container py-4">

        <h1 class="mb-1">My playlist sorter</h1>
        <p class="text-muted mb-4">sort and label your music playlist using javascript array methods</p>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title mb-3">song names</h3>
                <button class="btn btn-primary mr-2" onclick="sortAZ()">sort A to Z</button>
                <button class="btn btn-primary mr-2" onclick="sortZA()">sort Z to A</button>
                <div id="nameResults" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>
    
    
        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">play counts</h3>
                <button class="btn btn-primary mr-2" onclick="sortLeast()">Least played first</button>
                <button class="btn btn-primary mr-2" onclick="sortMost()">Most played first</button>
                <div id="playResults" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h3 class="card-title">song durations</h3>
                <button class="btn btn-primary mr-2" onclick="sortShortest()">Shortest first</button>
                <button class="btn btn-primary mr-2" onclick="sortLongest()">Longest first</button>
                <div id="durationResults" class="box p-3 mt-3 rounded"></div>
            </div>
        </div>
        </div>
    </div>
    <script>
        var songs = ["zoom", "bounce", "glow", "rish", "spark"];  
        var plays = [320, 85, 210, 50, 175];

        document.getElementById("nameResults").innerHTML = songs.join(", ");
        document.getElementById("playResults").innerHTML = plays.join(", ");
        document.getElementById("durationResults").innerHTML = "press the button to play!"

        function sortAZ() {
            songs.sort();
            document.getElementById("nameResults").innerHTML = songs.join(", ");}
            function sortZA() { songs.sort().reverse();
            document.getElementById("nameResults").innerHTML = songs.join(", ");}
            function sortLeast() { plays.sort(function(a, b){return a-b});
            document.getElementById("playResults").innerHTML = plays.join(", ");}
            function sortMost() { plays.sort(function(a, b){return b-a});
            document.getElementById("playResults").innerHTML = plays.join(", ");}
            function sortShortest() { durations.sort(function(a, b){return a-b});
            document.getElementById("durationResults").innerHTML = durations.join(", ");}
            function sortLongest() { durations.sort(function(a, b){return b-a});
            document.getElementById("durationResults").innerHTML = durations.join(", ");}
        
    </script>
</body>
</html>
